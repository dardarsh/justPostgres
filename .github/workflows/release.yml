# Build and publish every image justpostgres needs, on a tag.
#
# The point is that a release does not depend on whoever happens to be at a
# laptop. It also builds amd64 natively rather than under emulation, which for
# the Postgres images — apt-installing PostGIS and friends — is the difference
# between minutes and most of an hour.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish, e.g. 0.1.0"
        required: true

env:
  NAMESPACE: hiteshchoudhary

jobs:
  # The two service images. Small, and they share a build context.
  services:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: control-plane
            dockerfile: apps/control-plane/Dockerfile
          - name: router
            dockerfile: apps/router/Dockerfile
    steps:
      - uses: actions/checkout@v4

      - id: version
        run: echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
        if: startsWith(github.ref, 'refs/tags/')

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.NAMESPACE }}/justpostgres-${{ matrix.name }}:${{ steps.version.outputs.value || inputs.version }}
            ${{ env.NAMESPACE }}/justpostgres-${{ matrix.name }}:latest
          # Layer cache in the registry, so a second image and a later release
          # do not rebuild the same Node dependencies from scratch.
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # One job per major so they build in parallel. Each is a slow apt install and
  # they are independent.
  postgres:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        major: [16, 17, 18]
    steps:
      - uses: actions/checkout@v4

      - id: version
        run: echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
        if: startsWith(github.ref, 'refs/tags/')

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: images/postgres
          build-args: PG_MAJOR=${{ matrix.major }}
          platforms: linux/amd64,linux/arm64
          push: true
          # The major tag is what the control plane resolves, and it moves with
          # each release. The version-qualified tag is what you pin to when you
          # need a specific build back.
          tags: |
            ${{ env.NAMESPACE }}/justpostgres-postgres:${{ matrix.major }}
            ${{ env.NAMESPACE }}/justpostgres-postgres:${{ matrix.major }}-${{ steps.version.outputs.value || inputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
